plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gtman.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.gtman.browser"
        minSdk 30
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        gt {
            storeFile file('gt.keystore')
            storePassword 'gtbrowser'
            keyAlias 'gt'
            keyPassword 'gtbrowser'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.gt
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
